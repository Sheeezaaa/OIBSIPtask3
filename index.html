<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <main class="converter-container">
        <div class="converter-card">
            <!-- Header -->
            <header class="card-header">
                <div class="header-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/>
                        <path d="M12 9v4"/>
                    </svg>
                </div>
                <h1>Temperature Converter</h1>
                <p class="subtitle">Convert values between Celsius, Fahrenheit, and Kelvin with real-time validation.</p>
            </header>

            <!-- Converter Form -->
            <form id="converter-form" onsubmit="return false;">
                <div class="form-grid">
                    <!-- Temperature Value Input -->
                    <div class="form-group flex-input">
                        <label for="temp-input">Temperature Value</label>
                        <div class="input-wrapper">
                            <input 
                                type="text" 
                                id="temp-input" 
                                placeholder="e.g. 25 or -10" 
                                autocomplete="off"
                                spellcheck="false"
                            >
                            <span class="unit-symbol" id="input-unit-symbol">°C</span>
                        </div>
                    </div>

                    <!-- Input Unit Selector Dropdown -->
                    <div class="form-group flex-unit">
                        <label for="unit-select">Input Unit</label>
                        <select id="unit-select" class="custom-select">
                            <option value="celsius" selected>Celsius (°C)</option>
                            <option value="fahrenheit">Fahrenheit (°F)</option>
                            <option value="kelvin">Kelvin (K)</option>
                        </select>
                    </div>
                </div>

                <!-- Validation Error Message Alert Box -->
                <div id="error-box" class="error-box hidden" role="alert">
                    <svg class="error-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="12"/>
                        <line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                    <span id="error-text">Please enter a valid numeric temperature value.</span>
                </div>

                <!-- Action Buttons: Convert & Clear -->
                <div class="button-group">
                    <button type="submit" id="convert-btn" class="btn btn-primary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                            <polyline points="23 4 23 10 17 10"/>
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                        </svg>
                        Convert
                    </button>
                    <button type="button" id="reset-btn" class="btn btn-secondary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 6h18"/>
                            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
                        </svg>
                        Clear
                    </button>
                </div>
            </form>

            <!-- Quick Presets -->
            <div class="presets-section">
                <span class="presets-label">Quick Presets:</span>
                <div class="preset-chips">
                    <button type="button" class="chip" data-val="-273.15" data-unit="celsius">Absolute Zero (-273.15°C)</button>
                    <button type="button" class="chip" data-val="0" data-unit="celsius">Freezing (0°C)</button>
                    <button type="button" class="chip" data-val="20" data-unit="celsius">Room Temp (20°C)</button>
                    <button type="button" class="chip" data-val="37" data-unit="celsius">Body Temp (37°C)</button>
                    <button type="button" class="chip" data-val="100" data-unit="celsius">Boiling (100°C)</button>
                </div>
            </div>

            <!-- Simultaneous Output Display Section -->
            <section class="results-section">
                <h2>Converted Values</h2>
                <div class="results-grid">
                    <!-- Celsius Card -->
                    <div class="result-card" id="card-celsius">
                        <div class="card-header-inner">
                            <span class="unit-name">Celsius</span>
                            <span class="badge">°C</span>
                        </div>
                        <div class="value-display" id="res-celsius">--</div>
                        <button type="button" class="copy-btn" data-target="res-celsius" title="Copy value">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                            </svg>
                            <span>Copy</span>
                        </button>
                    </div>

                    <!-- Fahrenheit Card -->
                    <div class="result-card" id="card-fahrenheit">
                        <div class="card-header-inner">
                            <span class="unit-name">Fahrenheit</span>
                            <span class="badge">°F</span>
                        </div>
                        <div class="value-display" id="res-fahrenheit">--</div>
                        <button type="button" class="copy-btn" data-target="res-fahrenheit" title="Copy value">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                            </svg>
                            <span>Copy</span>
                        </button>
                    </div>

                    <!-- Kelvin Card -->
                    <div class="result-card" id="card-kelvin">
                        <div class="card-header-inner">
                            <span class="unit-name">Kelvin</span>
                            <span class="badge">K</span>
                        </div>
                        <div class="value-display" id="res-kelvin">--</div>
                        <button type="button" class="copy-btn" data-target="res-kelvin" title="Copy value">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                            </svg>
                            <span>Copy</span>
                        </button>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
